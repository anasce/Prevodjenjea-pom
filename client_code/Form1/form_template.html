<anvil-form layout="Prevo_enje_ei.Layouts.BaseLayout">
  <anvil-block slot="actions">
    <anvil-component type="ColumnPanel" name="actions_panel">
      <anvil-component type="Label" name="label_1" prop:role="h1" prop:text="E2I PREVODILAC" prop:foreground="#333333"></anvil-component>
      <!-- Zamenjeno sa tačnom heksadecimalnom bojom Anvil ikonice -->
      <anvil-component type="Label" name="label_2" prop:role="subheading" prop:text="Konvertor ekavice u ijekavicu" prop:foreground="#226096"></anvil-component>
    </anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <anvil-component type="ColumnPanel" name="column_panel_1" prop:role="card"></anvil-component>
    <anvil-component type="TextArea" name="text_area_1" prop:placeholder="Unesite ekavski tekst ovdje..."></anvil-component>
    <anvil-component type="Button" name="button_1" prop:text="" prop:icon="fa:angle-right"></anvil-component>
    <anvil-component type="TextArea" name="text_area_2" prop:placeholder="Ijekavski rezultat..."></anvil-component>
  </anvil-block>
  <anvil-block slot="title"></anvil-block>
</anvil-form>
